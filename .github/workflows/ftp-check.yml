# Разовая проверка связи GitHub → Timeweb (без паролей): какие порты и адреса доступны из-за рубежа.
name: Проверка связи с Timeweb
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Порты
        run: |
          for p in 21 22 80 443; do timeout 10 bash -c "echo > /dev/tcp/92.53.96.140/$p" 2>/dev/null && echo "vh432 порт $p открыт" || echo "vh432 порт $p недоступен"; done
      - name: Сайты по HTTP(S)
        run: |
          for u in http://new.gidrologia.ru/ https://gidrologia.ru/ https://hosting.timeweb.ru/ https://timeweb.com/; do
            printf "%s " "$u"; curl -4 -s -o /dev/null -m 15 -w "%{http_code} %{remote_ip}\n" "$u" || echo "нет ответа"
          done
