# Сборка сайта при каждом изменении (в том числе из кабинета редактора).
# Готовые файлы кладутся в ветку `deploy`; хостинг Timeweb сам забирает их оттуда
# (server/pull.php по расписанию Crontab). Пароли и ключи в сборку не попадают.
name: Сборка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Проверка сборки
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test "$(find dist -name '*.html' | wc -l)" -gt 500
          ! find dist -name 'config.php' | grep -q .

      - name: Публикация сборки в ветку deploy
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
