# Сборка сайта при каждом изменении (в том числе из кабинета редактора).
# Готовая сборка частями кладётся в ветку `vykladka`; хостинг сам забирает её через jsDelivr
# (server/pull.php по расписанию Crontab). Копия сборки по-прежнему кладётся в ветку `deploy`.
# Пароли и ключи в сборку не попадают. Прежний путь по FTP убран: с 3 ноября 2026 Timeweb
# закрыт для подключений из-за рубежа.
name: Сборка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Проверка сборки
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test "$(find dist -name '*.html' | wc -l)" -gt 500
          ! find dist -name 'config.php' | grep -q .

      - name: Публикация сборки в ветку deploy
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Публикация сборки в ветку vykladka (её забирает хостинг через jsDelivr)
        # Хостинг не достаёт до GitHub-файлов, а GitHub — до хостинга. Сборка режется на части по 1,5 МБ
        # и кладётся в ветку vykladka. ~/deploy/pull.php раз в 3 минуты узнаёт версию ветки через api.github.com
        # и скачивает части с cdn.jsdelivr.net по точному sha коммита, сверяя md5.
        run: |
          mkdir -p pkg/site && cp -r dist/. pkg/site/ && rm -rf pkg/site/.git
          (cd pkg && zip -qrX ../build.zip site)
          mkdir vk && cd vk
          split -b 1500000 -d -a 2 ../build.zip build.zip.p
          { echo "$GITHUB_SHA"; md5sum ../build.zip | cut -d' ' -f1; ls build.zip.p*; } > manifest.txt
          cp ../import/files-to-copy.tsv ../import/media-refs.txt .
          cat manifest.txt
          git init -q -b vykladka
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Выкладка ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vykladka
          echo "Сборка ${GITHUB_SHA::7} опубликована, хостинг выложит её в течение 3–6 минут"
