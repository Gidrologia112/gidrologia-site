# Собрано из scripts/cms-config.src.yml скриптом scripts/build-cms-config.py — правьте исходник.
backend:
  name: github
  repo: Gidrologia112/gidrologia-site
  branch: main
  base_url: https://gidrologia.ru
  auth_endpoint: admin/oauth/auth.php
  commit_messages:
    create: 'Создано: {{collection}} «{{slug}}»'
    update: 'Изменено: {{collection}} «{{slug}}»'
    delete: 'Удалено: {{collection}} «{{slug}}»'
    uploadMedia: Загружен файл {{path}}
    deleteMedia: Удалён файл {{path}}
publish_mode: editorial_workflow
locale: ru
site_url: https://gidrologia.ru
display_url: https://gidrologia.ru
logo_url: /logo.svg
media_folder: public/img/uploads
public_folder: /img/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: publikatsii
  label: Публикации
  label_singular: статью
  description: Статьи базы знаний. Новая статья появится на сайте через 2–3 минуты после публикации.
  folder: src/content/publikatsii
  extension: md
  format: frontmatter
  create: true
  slug: '{{fields.url}}'
  identifier_field: title
  summary: '{{title}} — {{date}}'
  sortable_fields:
  - date
  - title
  view_filters:
  - label: Плавательные водоёмы
    field: rubric
    pattern: Плавательные
  - label: Декоративные водоёмы
    field: rubric
    pattern: Декоративные
  - label: Монтаж оборудования
    field: rubric
    pattern: оборудования
  preview_path: publikatsii/{{slug}}/
  fields:
  - label: Заголовок
    name: title
    widget: string
  - label: Адрес страницы
    name: url
    widget: string
    required: false
    hint: Можно не заполнять — при сохранении адрес сделается из заголовка латиницей. У старых записей адрес не меняется.
  - label: Дата
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD.MM.YYYY
    time_format: false
    picker_utc: true
    default: '{{now}}'
  - label: Основная рубрика
    name: rubric
    widget: select
    options:
    - Плавательные водоёмы
    - Живые бассейны
    - Декоративные водоёмы
    - Безопасные каскадные водоёмы
    - Водоёмы для рыб
    - Классические бассейны
    - Фонтаны
    - Водосохранные технологии
    - Проектирование
    - Монтаж гидроизоляции
    - Монтаж оборудования
    - Обслуживание
    - Партнёрам
    required: false
  - label: Все рубрики
    name: rubrics
    widget: select
    multiple: true
    options:
    - Плавательные водоёмы
    - Живые бассейны
    - Декоративные водоёмы
    - Безопасные каскадные водоёмы
    - Водоёмы для рыб
    - Классические бассейны
    - Фонтаны
    - Водосохранные технологии
    - Проектирование
    - Монтаж гидроизоляции
    - Монтаж оборудования
    - Обслуживание
    - Партнёрам
    required: false
    hint: По ним статья находится в фильтрах раздела «Публикации»
  - label: Краткое описание
    name: excerpt
    widget: text
    required: false
    hint: '1–2 предложения: показывается в списке и в поисковиках'
  - label: Обложка
    name: cover
    widget: image
    required: false
    choose_url: false
  - label: По материалам
    name: source
    widget: string
    required: false
    hint: Если статья подготовлена по чужим материалам
  - label: Текст
    name: body
    widget: markdown
    modes:
    - rich_text
    - raw
  - label: Старый адрес
    name: old
    widget: hidden
    required: false
  - label: ID NetCat
    name: netcatId
    widget: hidden
    required: false
  - label: Порядок
    name: order
    widget: hidden
    required: false
  - label: Перенесено
    name: imported
    widget: hidden
    default: false
