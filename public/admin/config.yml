      name: photos
      widget: photos
      required: false
      hint: Можно выбрать или перетащить сразу много фото — они уменьшатся и загрузятся сами
  - label: Подразделы
    name: groups
    widget: list
    required: false
    summary: '{{fields.title}}'
    fields:
    - label: Название подраздела
      name: title
      widget: string
    - label: Объекты
