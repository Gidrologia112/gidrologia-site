- name: uslugi
  label: Решения
  label_singular: решение
  description: 'Направления работы: название, краткое описание, факты и подробный текст.'
  folder: src/data/services
  extension: json
  format: json
  create: false
  delete: false
  identifier_field: title
  summary: '{{title}}'
  preview_path: uslugi/{{slug}}/
  fields:
  - label: Название
    name: title
    widget: string
  - label: Адрес (не менять)
    name: slug
    widget: hidden
  - label: Группа
    name: group
    widget: select
    options:
    - label: Что мы создаём
      value: main
    - label: Также строим
      value: extra
    - label: Работы и сервис
      value: work
  - label: Порядок в списке
    name: order
    widget: number
    value_type: int
  - label: Краткое описание
    name: short
    widget: text
  - label: Факты
    name: facts
    widget: list
    summary: '{{fields.label}}: {{fields.value}}'
    fields:
    - label: Параметр
      name: label
      widget: string
    - label: Значение
      name: value
      widget: string
  - label: Что входит
    name: includes
    widget: list
    required: false
    field:
      label: Пункт
      name: item
      widget: string
  - label: Обложка
    name: cover
    widget: image
    required: false
    choose_url: false
  - label: Ссылка на магазин
    name: shop
    widget: string
    required: false
  - label: Раздел галереи
    name: gallery
    widget: relation
    collection: galereya
    search_fields:
    - title
    value_field: slug
    display_fields:
    - title
    required: false
  - label: Раздел видео
    name: video
    widget: relation
    collection: video
    search_fields:
    - title
    value_field: slug
    display_fields:
    - title
    required: false
  - label: Рубрика статей
    name: rubric
    widget: select
    options:
    - Плавательные водоёмы
    - Живые бассейны
    - Декоративные водоёмы
    - Безопасные каскадные водоёмы
    - Водоёмы для рыб
    - Классические бассейны
    - Фонтаны
    - Водосохранные технологии
    - Проектирование
    - Монтаж гидроизоляции
    - Монтаж оборудования
    - Обслуживание
    - Партнёрам
    required: false
  - label: Цвет заглушки
    name: tone
    widget: hidden
- name: uslugi_text
  label: 'Решения: подробные тексты'
  label_singular: текст
  folder: src/content/uslugi
  extension: md
  format: frontmatter
  create: false
  delete: false
  identifier_field: title
  summary: '{{title}}'
  fields:
  - label: Решение
    name: title
    widget: string
    hint: Название для списка в кабинете; на сайте берётся из раздела «Решения»
  - label: Текст
    name: body
    widget: markdown
    modes:
    - rich_text
    - raw
  - label: Перенесено
    name: imported
    widget: hidden
    default: true
- name: proekty
  label: Проекты
  label_singular: проект
  folder: src/data/projects
  extension: json
  format: json
  create: true
  slug: '{{fields.slug}}'
  identifier_field: title
  preview_path: proekty/{{slug}}/
  fields:
  - label: Название
    name: title
    widget: string
  - label: Адрес страницы
    name: slug
    widget: string
    required: false
    hint: Можно не заполнять — при сохранении адрес сделается из заголовка. После публикации не менять.
  - label: Тип
    name: kind
    widget: string
    hint: 'Например: Проект плавательного водоёма'
  - label: Место
    name: place
    widget: string
  - label: Решение
    name: service
    widget: relation
    collection: uslugi
    search_fields:
    - title
    value_field: slug
    display_fields:
    - title
    required: false
  - label: Обложка
    name: cover
    widget: image
    required: false
    choose_url: false
  - label: Порядок
    name: order
    widget: number
    value_type: int
    default: 10
  - label: Описание
    name: html
    widget: markdown
    modes:
    - rich_text
    - raw
  - label: Фото проекта
    name: images
    widget: list
    required: false
    summary: '{{fields.caption}}'
    fields:
    - label: Фото
      name: src
      widget: image
      choose_url: false
    - label: Подпись
      name: caption
      widget: string
  - label: Цвет заглушки
    name: tone
    widget: hidden
    default: '#22465A'
- name: galereya
  label: Галерея
